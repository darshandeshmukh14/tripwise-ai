server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-For only from internal proxies (the Next.js BFF) so rate limiting sees the real client IP
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: tripwise-ai

  profiles:
    group:
      # The temporary H2 profile is a local-dev setup, so it pulls in the dev defaults
      h2: dev

  lifecycle:
    # Longer than the AI read timeout so in-flight generations can finish on shutdown
    timeout-per-shutdown-phase: 75s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripwise_db}
    username: ${DB_USERNAME:tripwise_user}
    password: ${DB_PASSWORD:tripwise_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TripWiseHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  # Base64-encoded HMAC-SHA key (>= 256 bits). Required: no default outside the dev profile.
  secret: ${JWT_SECRET}
  # Access token lifetime in milliseconds (default: 15 minutes); clients renew it with the refresh token
  expiration: ${JWT_EXPIRATION_MS:900000}
  # Rotating refresh token lifetime (default: 7 days)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  # Window in which a just-rotated refresh token is still accepted (parallel requests racing to refresh)
  refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:10s}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  # Sent as the X-Internal-Token header to the internal FastAPI service. Required: no default outside dev.
  api-key: ${AI_SERVICE_API_KEY}
  connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:10s}
  read-timeout: ${AI_SERVICE_READ_TIMEOUT:60s}

trip-generation:
  # Trips still GENERATING after this long are marked FAILED by the sweeper
  stale-after: ${TRIP_GENERATION_STALE_AFTER:10m}
  sweep-interval: ${TRIP_GENERATION_SWEEP_INTERVAL:PT1M}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  auth:
    # Per client IP (login + register). Loose because without TRUST_PROXY_HEADERS on the BFF all users share its IP.
    capacity: ${RATE_LIMIT_AUTH_CAPACITY:30}
    period: 1m
  login-email:
    capacity: ${RATE_LIMIT_LOGIN_EMAIL_CAPACITY:5}
    period: 1m
  ai:
    capacity: ${RATE_LIMIT_AI_CAPACITY:10}
    period: 1m
  web-hints:
    # Per user: plans/chat replies that may use Gemini web-search price hints
    capacity: ${RATE_LIMIT_WEB_HINTS_CAPACITY:20}
    period: 1d

cors:
  # Comma-separated browser origins; empty = no cross-origin access (the BFF calls server-to-server)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

logging:
  level:
    root: INFO
    com.tripwise: INFO
    org.flywaydb: INFO
