# Supported destination countries (v2). Indicative values only; review periodically.
#
# priceIndex: typical traveller cost level vs India (1.0) for stays, food, activities, local and in-country transport
# seasonProfile: default profile (seasons.yaml) for cities of the country that are not in cities.yaml
# roadNeighbours: countries reachable from this one by road (all other cross-border legs are flight-only)
# visaNote: short hint for Indian passport holders; always verify on official sources (rules change often)
countries:
